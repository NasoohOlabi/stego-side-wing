name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Sync
        run: uv sync --all-groups
      - name: Ruff check (Pyright-aligned roots)
        run: >-
          uv run ruff check
          src/app src/services src/content_acquisition
          src/integrations src/infrastructure src/workflows
      - name: Ruff format
        run: >-
          uv run ruff format --check
          src/app src/services src/content_acquisition
          src/integrations src/infrastructure src/workflows
      - name: Pyright
        run: uv run pyright
      - name: Pytest
        run: uv run pytest
