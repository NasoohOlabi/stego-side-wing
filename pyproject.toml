[project]
name = "stego-side-wing"
version = "0.1.0"
description = "Python backend and workflow runtime for stego pipelines (API, workflows, metrics)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.3",
    "beautifulsoup4>=4.14.3",
    "crawl4ai>=0.8.0",
    "flask-caching>=2.3.1",
    "flask-cors>=6.0.1",
    "flask[async]>=3.1.2",
    "google-genai>=1.0.0",
    "httpx>=0.28.1",
    "icecream>=2.1.10",
    "langdetect>=1.0.9",
    "loguru>=0.7.3",
    "ollama>=0.6.1",
    "openai>=2.26.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
    "selenium>=4.41.0",
    "sentence-transformers>=5.3.0",
    "trafilatura>=2.0.0",
]

[project.optional-dependencies]
metrics = [
    "nltk>=3.9.1",
    "torch>=2.6.0",
    "transformers>=4.50.0",
]

[dependency-groups]
dev = [
    # scripts/make_schema.py imports this; it was undeclared, so the script could not run.
    "genson>=1.3.0",
    "import-linter>=2.0",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-cov>=6.0.0",
    "requests-toolbelt>=1.0.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
addopts = "-q"
filterwarnings = [
    "ignore::requests.exceptions.RequestsDependencyWarning",
]

[tool.coverage.run]
source = ["src"]
# The suite itself is not the subject of measurement.
omit = ["src/tests/*"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

[tool.ruff]
target-version = "py313"
src = ["src"]
line-length = 100

[tool.ruff.lint]
# SIM/C4/RUF/PT added on top of the original E,F,I,UP,B set.
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PT"]
ignore = [
    "E501",
    # Pytest style choices this suite already made consistently; enforcing them would
    # churn ~40 existing tests for no behavioural gain.
    "PT011", # broad pytest.raises without match=
    "PT018", # composite assertions (assert a and b) read fine here
]

# RUF001/RUF002 stay on: this project has an explicit encoding-hygiene rule (AGENTS.md),
# and they caught a non-breaking hyphen sitting inside a live search query. These two
# characters are deliberate -- Google returns the angle quote in breadcrumbs, and the
# apostrophe is ordinary prose.
allowed-confusables = ["›", "’"]

[tool.ruff.lint.per-file-ignores]
"scripts/avg_er.py" = ["E402"]
"scripts/clean_data_boxing.py" = ["E402"]
"scripts/clean_news_researched.py" = ["E402"]
"scripts/clean_non_english.py" = ["E402"]
"scripts/make_schema.py" = ["E402"]
"scripts/monitor_generation_progress.py" = ["E402"]
"scripts/monitor_pareto_continuation.py" = ["E402"]
"scripts/run_zlg_batch_comparison.py" = ["E402"]
"scripts/strip_invisible_stego_payloads.py" = ["E402"]
"scripts/sync_missing_search_results.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
